name: Run linting

on: workflow_call

jobs:
  lint:
    name: Lint
    runs-on: runs-on,run-id=${{ github.run_id }},job=lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735
        with:
          bundler-cache: true
      - run: bundle exec rubocop